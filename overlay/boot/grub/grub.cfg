# JARVISOS GRUB - UEFI + BIOS live
set timeout=7
set default=0
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm
set menu_color_normal=white/black
set menu_color_highlight=black/cyan

menuentry "JARVISOS Live (quiet)" {
    linux /live/vmlinuz boot=live quiet splash components username=jarvis hostname=jarvisos noeject
    initrd /live/initrd.img
}
menuentry "JARVISOS Live (verbose)" {
    linux /live/vmlinuz boot=live components username=jarvis hostname=jarvisos noeject
    initrd /live/initrd.img
}
menuentry "JARVISOS Live (failsafe)" {
    linux /live/vmlinuz boot=live components username=jarvis hostname=jarvisos noeject memtest noapic noapm nodma nomce nolapic nomodeset nosmp vga=normal
    initrd /live/initrd.img
}
menuentry "Memory test" {
    linux16 /boot/memtest86+.bin
}
